name: C++ CI (Build & Test)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential cmake

      - name: Build and test with Makefile
        run: |
          make clean
          make all
          make test
          ./bin/cpp-ffmpeg-player --info assets/sample.mp4
          ./bin/cpp-ffmpeg-player --json assets/sample.mp4
          ./bin/cpp-ffmpeg-player --codec assets/sample.mp4

      - name: Build and test with CMake
        run: |
          cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake
          ctest --test-dir build-cmake --output-on-failure
